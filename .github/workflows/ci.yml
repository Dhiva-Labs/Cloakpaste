name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Fetch model
        run: npm run fetch:model
      - name: Model evaluation
        run: npm run eval:ner
      - name: End-to-end tests (headless Chrome)
        run: npm run build:test && npm run test:e2e
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: cloakpaste-zip
          path: dist/cloakpaste-*.zip
