<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
  aside { background: #f6f7f9; border-right: 1px solid #e5e7eb; padding: 16px 12px; }
  aside .new { border: 1px solid #d0d4da; border-radius: 8px; padding: 8px 10px; font-weight: 500; margin-bottom: 16px; }
  aside .t { padding: 7px 10px; border-radius: 6px; color: #4b5563; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .t.on { background: #e8eaee; color: #111827; }
  main { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 28px; border-bottom: 1px solid #eef0f3; font-weight: 600; }
  .log { flex: 1; overflow: auto; padding: 24px 0; }
  .msg { max-width: 600px; margin: 0 0 18px 44px; }
  .me { display: flex; justify-content: flex-end; }
  .me div { background: #f1f3f6; border-radius: 16px; padding: 10px 14px; max-width: 80%; white-space: pre-wrap; }
  .ai { white-space: pre-wrap; }
  .composer { width: 560px; margin: 0 0 22px 44px; border: 1px solid #d0d4da; border-radius: 16px; padding: 12px 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  #pm .ProseMirror { outline: none; min-height: 72px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
  #pm .ProseMirror p { margin: 0 0 4px; }
  .hint { color: #9ca3af; font-size: 12px; margin-top: 6px; }
</style>
<aside>
  <div class="new">+ New chat</div>
  <div class="t on">Customer escalation email</div>
  <div class="t">Fix flaky payment webhook</div>
  <div class="t">Quarterly report outline</div>
  <div class="t">SQL for churn cohort</div>
</aside>
<main>
  <header>Assistant</header>
  <div class="log" id="log"></div>
  <div class="composer"><div id="pm"></div><div class="hint">Message the assistant</div></div>
</main>
<script src="pm.bundle.js"></script>
