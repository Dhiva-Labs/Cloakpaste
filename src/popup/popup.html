<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloakpaste</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="row spread">
    <div class="row brand"><span class="logo" aria-hidden="true">▮</span><h1>Cloakpaste</h1></div>
    <label class="switch" title="Turn Cloakpaste on or off everywhere">
      <input type="checkbox" id="global" aria-label="Cloakpaste on">
      <span></span>
    </label>
  </header>

  <section class="card site">
    <div class="row spread">
      <div>
        <div id="host" class="host">—</div>
        <div id="status" class="muted small"></div>
      </div>
      <label class="switch" id="site-switch" hidden>
        <input type="checkbox" id="site" aria-label="Protect this site">
        <span></span>
      </label>
      <button id="add-site" class="primary" hidden>Protect this site</button>
    </div>
    <p id="reload-note" class="muted small" hidden>Reload the page to start protecting it.</p>
  </section>

  <section class="card">
    <div class="row spread">
      <h2>Hidden on this site</h2>
      <span id="count" class="muted small"></span>
    </div>
    <ul id="items" class="items"></ul>
    <p id="empty" class="muted small">Nothing hidden yet. Paste something with an email, key or name to see it here.</p>
    <div class="row spread foot">
      <button id="forget-all" class="link" hidden>Forget all for this site</button>
    </div>
  </section>

  <footer class="row spread">
    <span class="muted small">On-device. Nothing leaves your browser.</span>
    <button id="open-options" class="link">Settings and playground</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
